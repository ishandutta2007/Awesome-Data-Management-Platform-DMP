<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glowOrb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowOrb2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1.5" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #cbd5e1;
      }
      .node-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .flow-pulse {
        stroke-dasharray: 8 12;
        animation: dash 25s linear infinite;
      }
      .orb-pulse {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes floatOrb {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-15px) translateX(20px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Orbs (Behind content) -->
  <circle class="orb-pulse" cx="250" cy="120" r="220" fill="url(#glowOrb1)" />
  <circle class="orb-pulse" cx="950" cy="280" r="240" fill="url(#glowOrb2)" />

  <!-- Grid overlay -->
  <rect width="1200" height="400" fill="url(#gridPattern)" rx="16" />

  <!-- Dynamic Data Stream Vectors (Background/Middleground) -->
  <g class="flow-pulse" stroke="url(#lineGrad)" stroke-width="2" fill="none" opacity="0.7">
    <path d="M -50 100 Q 300 20 600 120 T 1250 80" />
    <path d="M -50 280 Q 350 360 700 260 T 1250 300" />
    <path d="M 100 420 Q 400 220 800 320 T 1250 180" opacity="0.4" />
  </g>

  <!-- Visual Dynamic Nodes -->
  <g opacity="0.6">
    <circle cx="280" cy="98" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="120" r="6" fill="#818cf8">
      <animate attributeName="r" values="5;9;5" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="920" cy="88" r="5" fill="#c084fc">
      <animate attributeName="r" values="4;7;4" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="260" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;8;4" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Center Decorative Glow Frame -->
  <rect x="70" y="45" width="1060" height="310" rx="14" fill="#0f172a" fill-opacity="0.65" stroke="#334155" stroke-width="1.2" />

  <!-- Core Content (Strictly in foreground) -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Icon / Badge above title -->
    <rect x="-85" y="-55" width="170" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <text x="0" y="-36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">⚡ CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text class="title-text" y="20" fill="url(#titleGrad)">Awesome Data Management Platform (DMP)</text>

    <!-- Subtitle -->
    <text class="subtitle-text" y="65">Audience Intelligence • Identity Resolution • Real-Time Segmentation • Activation</text>

    <!-- Feature Pills / Badges (In Foreground) -->
    <g transform="translate(0, 115)">
      <!-- Pill 1 -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="0" width="165" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="17" r="4.5" fill="#38bdf8" />
        <text class="tag-text" x="34" y="22" text-anchor="start">SaaS Market Leaders</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-180, 0)">
        <rect x="0" y="0" width="165" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="17" r="4.5" fill="#818cf8" />
        <text class="tag-text" x="34" y="22" text-anchor="start">Open-Source CDPs</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="17" r="4.5" fill="#a855f7" />
        <text class="tag-text" x="34" y="22" text-anchor="start">Identity Resolution</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="20" cy="17" r="4.5" fill="#34d399" />
        <text class="tag-text" x="34" y="22" text-anchor="start">Privacy &amp; Governance</text>
      </g>
    </g>
  </g>
</svg>
